<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: pick your interests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1015}
a{color:#C8F25A}a:hover{color:#E2FF9A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1015; color: #F2F4F7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#C8F25A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18l6-6 4 4 9-10"></path><path d="M16 6h6v6"></path></svg>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.5px">SIGNAL</span>
      </div>
      <span style="font-size: 13px; color: #9AA3B2">Step 1 of 2</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.02; text-transform: uppercase">What do you like to bet on?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #9AA3B2">Your agent scans every market, every day. You only hear about the data-backed edges that match what you pick here.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #9AA3B2">Sports</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{sports}}" as="s" hint-placeholder-count="8">
          <sc-if value="{{s.on}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{s.toggle}}" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #C8F25A; background: #C8F25A; color: #0D1015; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">{{s.label}}</button>
          </sc-if>
          <sc-if value="{{s.off}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{s.toggle}}" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #2A303B; background: #161A21; color: #F2F4F7; font: 500 14px 'IBM Plex Sans', sans-serif; cursor: pointer">{{s.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #9AA3B2">Bet types</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
          <sc-if value="{{t.on}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{t.toggle}}" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #C8F25A; background: #C8F25A; color: #0D1015; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">{{t.label}}</button>
          </sc-if>
          <sc-if value="{{t.off}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{t.toggle}}" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #2A303B; background: #161A21; color: #F2F4F7; font: 500 14px 'IBM Plex Sans', sans-serif; cursor: pointer">{{t.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <label for="team-search" style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #9AA3B2">Teams you follow</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #161A21; border: 1.5px solid #2A303B">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="team-search" type="text" placeholder="Search teams or players" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #F2F4F7; font: 400 15px 'IBM Plex Sans', sans-serif">
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 16px; background: #1E232C; font-size: 14px">Buffalo Bills<button aria-label="Remove Buffalo Bills" style="width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #9AA3B2; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 16px; background: #1E232C; font-size: 14px">New York Rangers<button aria-label="Remove New York Rangers" style="width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #9AA3B2; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #9AA3B2">Your style</div>
      <sc-for list="{{risks}}" as="r" hint-placeholder-count="3">
        <sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{r.pick}}" aria-pressed="true" style="text-align: left; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #C8F25A; background: #1A2012; color: #F2F4F7; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif">
            <span style="flex: none; width: 20px; height: 20px; border-radius: 10px; border: 6px solid #C8F25A; box-sizing: border-box"></span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{r.label}}</span><span style="font-size: 13px; color: #B4BCC8">{{r.desc}}</span></span>
          </button>
        </sc-if>
        <sc-if value="{{r.off}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{r.pick}}" aria-pressed="false" style="text-align: left; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #2A303B; background: #161A21; color: #F2F4F7; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif">
            <span style="flex: none; width: 20px; height: 20px; border-radius: 10px; border: 2px solid #5B6474; box-sizing: border-box"></span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{r.label}}</span><span style="font-size: 13px; color: #9AA3B2">{{r.desc}}</span></span>
          </button>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <div style="flex: none; padding: 16px 20px 34px; background: #0D1015; border-top: 1px solid #1E232C; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; color: #9AA3B2; text-align: center">Following {{count}} sports · {{typeCount}} bet types</div>
    <a href="Feed.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #C8F25A; color: #0D1015; text-decoration: none; font: 700 17px 'IBM Plex Sans', sans-serif">Build my feed</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sports: { NFL: true, MLB: true, NHL: true, NBA: false, 'College FB': false, Soccer: false, Tennis: false, Golf: false },
      types: { Spreads: true, Totals: true, Moneylines: false, 'Player props': true, Parlays: false, Futures: false },
      risk: 'balanced'
    };
  }
  renderVals() {
    const st = this.state;
    const sports = Object.keys(st.sports).map((k) => ({
      label: k, on: st.sports[k], off: !st.sports[k],
      toggle: () => this.setState({ sports: { ...st.sports, [k]: !st.sports[k] } })
    }));
    const types = Object.keys(st.types).map((k) => ({
      label: k, on: st.types[k], off: !st.types[k],
      toggle: () => this.setState({ types: { ...st.types, [k]: !st.types[k] } })
    }));
    const riskDefs = [
      { id: 'conservative', label: 'Conservative', desc: 'Fewer alerts. Only the strongest edges, mostly favorites and totals.' },
      { id: 'balanced', label: 'Balanced', desc: 'Solid edges across sides, totals and props.' },
      { id: 'longshot', label: 'Long shots', desc: 'Plus-money prices and props. Higher variance.' }
    ];
    const risks = riskDefs.map((r) => ({ ...r, on: st.risk === r.id, off: st.risk !== r.id, pick: () => this.setState({ risk: r.id }) }));
    return {
      sports, types, risks,
      count: sports.filter((s) => s.on).length,
      typeCount: types.filter((t) => t.on).length
    };
  }
}
</script>
</body>
</html>
